<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FOI Request Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f3ee;
    --surface: #ffffff;
    --ink: #1b2430;
    --muted: #5f6b7a;
    --line: #e2ded5;
    --brand: #1d3a5f;
    --brand-soft: #e7edf5;
    --danger: #b42318;
    --danger-soft: #fdecea;
    --received: #1d3a5f;   --received-bg: #e7edf5;
    --progress: #8a5a00;   --progress-bg: #fdf3dc;
    --responded: #1f6f4a;  --responded-bg: #e3f3ea;
    --closed: #4b5563;     --closed-bg: #eceef1;
    --withdrawn: #7a4b8a;  --withdrawn-bg: #f3eaf6;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 "Public Sans", system-ui, sans-serif;
  }
  button, input { font: inherit; }

  /* Header */
  header {
    background: var(--brand);
    color: #fff;
  }
  .bar {
    max-width: 1100px; margin: 0 auto; padding: 18px 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .bar h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  .bar p { margin: 2px 0 0; font-size: 13px; opacity: .75; }

  main { max-width: 1100px; margin: 0 auto; padding: 24px; }

  /* Buttons */
  .btn {
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px;
  }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: #fff; color: var(--brand); border-color: #fff; }
  .btn.solid { background: var(--brand); color: #fff; border-color: var(--brand); }
  .btn.solid:hover { background: #142b47; }
  .btn:disabled { opacity: .5; cursor: default; }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .stat {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px 16px; text-align: left; cursor: pointer;
  }
  .stat:hover { border-color: var(--muted); }
  .stat .n { font-size: 28px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat .l { color: var(--muted); font-size: 13px; font-weight: 500; }
  .stat.alert .n { color: var(--danger); }

  /* Filters */
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
  .chip {
    border: 1px solid var(--line); background: var(--surface); color: var(--muted);
    padding: 5px 12px; border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 600;
  }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }

  /* Table */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--line); }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; background: #faf9f6; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #faf9f6; }
  tbody tr:last-child td { border-bottom: 0; }
  td.id { color: var(--muted); font-variant-numeric: tabular-nums; width: 60px; }
  .subject { font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; }
  .due-late { color: var(--danger); font-weight: 600; }
  .empty { padding: 48px 16px; text-align: center; color: var(--muted); }

  /* Status badges */
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .s-RECEIVED    { color: var(--received);  background: var(--received-bg); }
  .s-IN_PROGRESS { color: var(--progress);  background: var(--progress-bg); }
  .s-RESPONDED   { color: var(--responded); background: var(--responded-bg); }
  .s-CLOSED      { color: var(--closed);    background: var(--closed-bg); }
  .s-WITHDRAWN   { color: var(--withdrawn); background: var(--withdrawn-bg); }
  .s-OVERDUE     { color: var(--danger);    background: var(--danger-soft); }

  /* Dialogs (new request + detail) */
  dialog {
    border: 0; border-radius: 14px; padding: 0; width: min(520px, calc(100vw - 32px));
    box-shadow: 0 20px 50px rgba(0,0,0,.2); color: var(--ink);
  }
  dialog::backdrop { background: rgba(20, 28, 40, .45); }
  .dlg-head { padding: 20px 24px 0; display: flex; justify-content: space-between; align-items: start; gap: 12px; }
  .dlg-head h2 { margin: 0; font-size: 18px; }
  .dlg-body { padding: 16px 24px 24px; }
  .x { border: 0; background: none; font-size: 22px; line-height: 1; cursor: pointer; color: var(--muted); }
  label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; }
  input[type=text], input[type=email], input[type=date] {
    width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: #fff;
  }
  input:focus { outline: 2px solid var(--brand); outline-offset: -1px; border-color: transparent; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }

  dl { display: grid; grid-template-columns: 120px 1fr; gap: 6px 12px; margin: 0 0 16px; font-size: 14px; }
  dt { color: var(--muted); }
  dd { margin: 0; }
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 20px 0 8px; }
  .move { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .timeline { list-style: none; margin: 0; padding: 0; border-left: 2px solid var(--line); }
  .timeline li { position: relative; padding: 0 0 14px 16px; font-size: 14px; }
  .timeline li::before {
    content: ""; position: absolute; left: -6px; top: 6px; width: 10px; height: 10px;
    border-radius: 50%; background: var(--brand);
  }
  .timeline .when { color: var(--muted); font-size: 12px; }
  .timeline .note { color: var(--muted); font-style: italic; }

  /* Toast */
  #toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 14px;
    opacity: 0; pointer-events: none; transition: opacity .2s; max-width: calc(100vw - 32px);
  }
  #toast.show { opacity: 1; }
  #toast.error { background: var(--danger); }

  @media (max-width: 680px) {
    .bar, main { padding-left: 16px; padding-right: 16px; }
    .hide-sm { display: none; }
    th, td { padding: 10px 12px; }
  }
</style>
</head>
<body>

<header>
  <div class="bar">
    <div>
      <h1>FOI Request Tracker</h1>
      <p>Freedom of Information requests, deadlines and status</p>
    </div>
    <button class="btn primary" id="newBtn">+ New request</button>
  </div>
</header>

<main>
  <section class="stats" id="stats"></section>

  <div class="toolbar" id="filters"></div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Request</th>
          <th class="hide-sm">Received</th>
          <th>Due</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>

<!-- New request -->
<dialog id="newDlg">
  <form id="newForm">
    <div class="dlg-head">
      <h2>New FOI request</h2>
      <button type="button" class="x" data-close aria-label="Close">&times;</button>
    </div>
    <div class="dlg-body">
      <label for="f-name">Requester name</label>
      <input type="text" id="f-name" name="requester_name" required>
      <label for="f-email">Requester email</label>
      <input type="email" id="f-email" name="requester_email" required>
      <label for="f-subject">Subject</label>
      <input type="text" id="f-subject" name="subject" required>
      <label for="f-date">Date received</label>
      <input type="date" id="f-date" name="received_date" required>
      <div class="hint">The due date is set automatically: 20 working days, skipping weekends and bank holidays.</div>
      <div class="actions">
        <button type="button" class="btn" data-close>Cancel</button>
        <button type="submit" class="btn solid">Create request</button>
      </div>
    </div>
  </form>
</dialog>

<!-- Request detail -->
<dialog id="detailDlg">
  <div class="dlg-head">
    <h2 id="d-title"></h2>
    <button type="button" class="x" data-close aria-label="Close">&times;</button>
  </div>
  <div class="dlg-body" id="d-body"></div>
</dialog>

<div id="toast"></div>

<script>
// Mirrors ALLOWED_TRANSITIONS in app/workflow.py
const NEXT = {
  RECEIVED: ["IN_PROGRESS", "WITHDRAWN"],
  IN_PROGRESS: ["RESPONDED", "WITHDRAWN"],
  RESPONDED: ["CLOSED"],
  CLOSED: [],
  WITHDRAWN: [],
};
const LABEL = {
  RECEIVED: "Received", IN_PROGRESS: "In progress", RESPONDED: "Responded",
  CLOSED: "Closed", WITHDRAWN: "Withdrawn", OVERDUE: "Overdue",
};
const ACTION = {
  IN_PROGRESS: "Start work", RESPONDED: "Mark responded",
  CLOSED: "Close", WITHDRAWN: "Withdraw",
};

let filter = "ALL";   // ALL | a status | OVERDUE
const $ = (id) => document.getElementById(id);

// ---------- API ----------
// fetch wrapper that throws with the API's "detail" message so errors can be shown in a toast.
async function api(path, options = {}) {
  const res = await fetch(path, {  // same origin as the API, so relative paths work
    headers: { "Content-Type": "application/json" },
    ...options,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    let msg = data.detail || `Request failed (${res.status})`;
    // FastAPI validation errors (422) return a list of {msg, ...}
    if (Array.isArray(msg)) msg = msg.map((e) => e.msg.replace(/^Value error, /, "")).join("; ");
    throw new Error(msg);
  }
  return data;
}

// ---------- helpers ----------
// Escape user-entered text before putting it into innerHTML.
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function fmtDate(iso) {
  return new Date(iso + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
}
function fmtStamp(s) {
  return new Date(s.replace(" ", "T") + "Z").toLocaleString("en-GB", { dateStyle: "medium", timeStyle: "short" });
}
// Local date as YYYY-MM-DD (toISOString alone would use UTC and can be off by a day).
function todayISO() {
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}
function daysUntil(iso) {
  return Math.round((new Date(iso + "T00:00:00") - new Date(todayISO() + "T00:00:00")) / 86400000);
}
function badge(status) {
  return `<span class="badge s-${status}">${LABEL[status]}</span>`;
}
function dueText(r) {
  const open = r.status === "RECEIVED" || r.status === "IN_PROGRESS";
  if (!open) return "";
  const d = daysUntil(r.due_date);
  if (r.is_overdue) return `${-d} day${d === -1 ? "" : "s"} overdue`;
  if (d === 0) return "Due today";
  return `${d} day${d === 1 ? "" : "s"} left`;
}
let toastTimer;
function toast(msg, isError = false) {
  const t = $("toast");
  t.textContent = msg;
  t.className = "show" + (isError ? " error" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.className = ""), 3500);
}

// ---------- render ----------
async function loadStats() {
  const s = await api("/stats");
  const cards = [
    ["ALL", "Open requests", s.RECEIVED + s.IN_PROGRESS],
    ["OVERDUE", "Overdue", s.overdue, s.overdue > 0],
    ["RESPONDED", "Responded", s.RESPONDED],
    ["CLOSED", "Closed", s.CLOSED],
    ["WITHDRAWN", "Withdrawn", s.WITHDRAWN],
  ];
  $("stats").innerHTML = cards.map(([key, label, n, alert]) =>
    `<button class="stat${alert ? " alert" : ""}" data-filter="${key}">
       <div class="n">${n}</div><div class="l">${label}</div>
     </button>`).join("");
}

function renderFilters() {
  const keys = ["ALL", "RECEIVED", "IN_PROGRESS", "RESPONDED", "CLOSED", "WITHDRAWN", "OVERDUE"];
  $("filters").innerHTML = keys.map((k) =>
    `<button class="chip" data-filter="${k}" aria-pressed="${k === filter}">${k === "ALL" ? "All" : LABEL[k]}</button>`
  ).join("");
}

async function loadRequests() {
  let qs = "";
  if (filter === "OVERDUE") qs = "?overdue=true";
  else if (filter !== "ALL") qs = "?status=" + filter;
  const rows = await api("/requests" + qs);

  if (rows.length === 0) {
    $("rows").innerHTML = `<tr><td colspan="5" class="empty">No requests here yet.</td></tr>`;
    return;
  }
  $("rows").innerHTML = rows.map((r) => `
    <tr data-id="${r.id}">
      <td class="id">${r.id}</td>
      <td>
        <div class="subject">${esc(r.subject)}</div>
        <div class="sub">${esc(r.requester_name)}</div>
      </td>
      <td class="hide-sm">${fmtDate(r.received_date)}</td>
      <td>
        <div class="${r.is_overdue ? "due-late" : ""}">${fmtDate(r.due_date)}</div>
        <div class="sub ${r.is_overdue ? "due-late" : ""}">${dueText(r)}</div>
      </td>
      <td>${badge(r.status)} ${r.is_overdue ? badge("OVERDUE") : ""}</td>
    </tr>`).join("");
}

async function refresh() {
  renderFilters();
  try {
    await Promise.all([loadStats(), loadRequests()]);  // independent calls, run in parallel
  } catch (e) {
    toast(e.message, true);
  }
}

// ---------- detail ----------
async function openDetail(id) {
  let r;
  try { r = await api(`/requests/${id}`); }
  catch (e) { return toast(e.message, true); }

  $("d-title").textContent = `#${r.id} · ${r.subject}`;
  const next = NEXT[r.status];
  $("d-body").innerHTML = `
    <div style="margin-bottom:14px">${badge(r.status)} ${r.is_overdue ? badge("OVERDUE") : ""}</div>
    <dl>
      <dt>Requester</dt><dd>${esc(r.requester_name)}</dd>
      <dt>Email</dt><dd><a href="mailto:${esc(r.requester_email)}">${esc(r.requester_email)}</a></dd>
      <dt>Received</dt><dd>${fmtDate(r.received_date)}</dd>
      <dt>Due</dt><dd class="${r.is_overdue ? "due-late" : ""}">${fmtDate(r.due_date)} ${dueText(r) ? "· " + dueText(r) : ""}</dd>
    </dl>

    <h3>Update status</h3>
    ${next.length ? `
      <input type="text" id="d-note" placeholder="Optional note, e.g. 'Sent to records team'">
      <div class="move">
        ${next.map((s) => `<button class="btn ${s === "WITHDRAWN" ? "" : "solid"}" data-move="${s}">${ACTION[s]}</button>`).join("")}
      </div>`
    : `<div class="sub">This request is ${LABEL[r.status].toLowerCase()}. No further changes are possible.</div>`}

    <h3>History</h3>
    <ul class="timeline">
      ${r.events.map((e) => `
        <li>
          <div>${e.from_status ? `${LABEL[e.from_status]} → <strong>${LABEL[e.to_status]}</strong>` : "<strong>Request received</strong>"}</div>
          ${e.note ? `<div class="note">“${esc(e.note)}”</div>` : ""}
          <div class="when">${fmtStamp(e.created_at)}</div>
        </li>`).join("")}
    </ul>`;

  $("d-body").querySelectorAll("[data-move]").forEach((btn) => {
    btn.onclick = async () => {
      btn.disabled = true;
      try {
        const note = $("d-note").value.trim() || null;
        await api(`/requests/${r.id}/transitions`, {
          method: "POST",
          body: JSON.stringify({ to_status: btn.dataset.move, note }),
        });
        toast(`Request #${r.id} moved to ${LABEL[btn.dataset.move]}`);
        await Promise.all([openDetail(r.id), refresh()]);
      } catch (e) {
        toast(e.message, true);
        btn.disabled = false;
      }
    };
  });

  if (!$("detailDlg").open) $("detailDlg").showModal();
}

// ---------- events ----------
// One delegated listener, because table rows and cards are re-rendered on every refresh.
document.addEventListener("click", (e) => {
  const f = e.target.closest("[data-filter]");
  if (f) { filter = f.dataset.filter; refresh(); return; }

  const row = e.target.closest("tr[data-id]");
  if (row) { openDetail(row.dataset.id); return; }

  if (e.target.closest("[data-close]")) e.target.closest("dialog").close();
});

$("newBtn").onclick = () => {
  $("newForm").reset();
  $("f-date").value = todayISO();
  $("f-date").max = todayISO();
  $("newDlg").showModal();
};

$("newForm").onsubmit = async (e) => {
  e.preventDefault();
  const body = Object.fromEntries(new FormData(e.target));
  try {
    const r = await api("/requests", { method: "POST", body: JSON.stringify(body) });
    $("newDlg").close();
    toast(`Request #${r.id} created. Due ${fmtDate(r.due_date)}`);
    filter = "ALL";
    refresh();
  } catch (err) {
    toast(err.message, true);
  }
};

refresh();
</script>
</body>
</html>
