<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}FOI Request Tracker{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Unbounded:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    /* Black, with white used as light. Hierarchy is opacity. Red means one thing: overdue. */
    --bg: #000;
    --fg: #fff;
    --fg-muted: rgba(255, 255, 255, 0.74);
    --fg-faint: rgba(255, 255, 255, 0.6);
    --line: rgba(255, 255, 255, 0.16);
    --surface: rgba(255, 255, 255, 0.04);
    --late: #ff5a4f;                       /* 6.4:1 on black */
    --late-wash: rgba(255, 90, 79, 0.09);

    --gutter: clamp(16px, 4vw, 40px);
    --measure: 1180px;

    --font: "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --font-display: "Unbounded", "Archivo", "Helvetica Neue", Arial, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.5 var(--font);
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--fg); color: var(--bg); }
  :focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }

  .container { max-width: calc(var(--measure) + var(--gutter) * 2); margin: 0 auto; padding: 0 var(--gutter); }
  .label {
    font: 500 11px/1.4 var(--font-mono);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fg-faint);
  }
  .mono { font: 13px/1.5 var(--font-mono); font-variant-numeric: tabular-nums; }
  .muted { color: var(--fg-muted); }
  .faint { color: var(--fg-faint); }
  .small { font-size: 13px; }
  .late-text { color: var(--late); }

  /* Top bar */
  .top {
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 0; border-bottom: 1px solid var(--line);
  }
  .top .name { font: 800 14px/1 var(--font-display); letter-spacing: 0.02em; text-transform: uppercase; }
  .top a.label:hover { color: var(--fg); }

  /* Status: marker + text. Filled = open, outlined = finished. */
  .status { white-space: nowrap; }
  .status::before {
    content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 8px;
    vertical-align: 1px; background: currentColor;
  }
  .status.open { color: var(--fg); }
  .status.done { color: var(--fg-faint); }
  .status.done::before { background: none; border: 1px solid currentColor; }
  .flag { display: inline-block; color: var(--late); }

  /* Forms: hairline fields, sharp buttons. Primary is solid white, secondary is outlined. */
  .field { display: flex; flex-direction: column; gap: 6px; }
  input[type=text], input[type=email], input[type=date] {
    font: 15px/1.4 var(--font); color: var(--fg); background: transparent;
    border: 0; border-bottom: 1px solid var(--line); padding: 8px 0; border-radius: 0;
    color-scheme: dark;
  }
  input:focus { outline: none; border-bottom-color: var(--fg); }
  .btn {
    font: 500 12px/1 var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase;
    padding: 14px 20px; border: 1px solid var(--fg); background: var(--fg); color: var(--bg);
    cursor: pointer; transition: background .15s, color .15s;
  }
  .btn:hover { background: transparent; color: var(--fg); }
  .btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
  .btn.ghost:hover { border-color: var(--fg); }

  /* Error banner: marked by text and a rule, not a coloured box */
  .error { border-left: 3px solid var(--late); padding: 10px 0 10px 14px; margin: 0 0 20px; color: var(--fg); }
  .error .label { color: var(--late); display: block; margin-bottom: 2px; }

  footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; padding: 28px 0 48px; }

  {% block styles %}{% endblock %}
</style>
</head>
<body>
<div class="container">
  <header class="top">
    <a class="name" href="/">FOI Tracker</a>
    <a class="label" href="/docs">API docs →</a>
  </header>

  {% block content %}{% endblock %}
</div>
</body>
</html>
