<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}FOI Request Tracker{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    /* Each colour has one job. Navy = actions. Red = overdue, nothing else. */
    --bg: #f6f5f1;
    --surface: #fff;
    --ink: #1c2430;
    --muted: #586170;        /* 6.1:1 on white */
    --line: #e2dfd7;
    --line-strong: #cbc6ba;
    --head: #f1efe9;
    --accent: #1f3d6b;
    --accent-hover: #142a4d;
    --late: #b3261e;         /* 6.5:1 on white */
    --late-soft: #fbedeb;
    --radius: 4px;

    --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font); }
  a { color: var(--accent); }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  h1, h2 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }

  .wrap { max-width: 1160px; margin: 0 auto; padding: 0 24px; }
  .muted { color: var(--muted); }
  .mono { font-family: var(--mono); font-size: 13.5px; font-variant-numeric: tabular-nums; }
  .small { font-size: 13px; }
  .late-text { color: var(--late); }

  /* Header */
  .top { background: var(--surface); border-bottom: 1px solid var(--line); }
  .top .wrap { display: flex; justify-content: space-between; align-items: center; height: 56px; }
  .brand { font-weight: 600; color: var(--ink); text-decoration: none; }
  .brand span { color: var(--muted); font-weight: 400; margin-left: 8px; }
  .top nav a { font-size: 14px; text-decoration: none; }
  .top nav a:hover { text-decoration: underline; }

  main.wrap { padding-top: 32px; padding-bottom: 56px; }

  /* Panels: white, hairline border, no shadow */
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
  .panel-head { padding: 14px 20px; border-bottom: 1px solid var(--line); font-weight: 600; font-size: 14px; }
  .panel-body { padding: 20px; }

  /* Status tag: neutral, with a marker. Filled = open, outlined = finished. Text always says the status. */
  .tag {
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    font-size: 13px; font-weight: 500; padding: 2px 8px; border-radius: var(--radius);
    border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  }
  .tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .tag.done { color: var(--muted); }
  .tag.done::before { background: none; border: 1.5px solid currentColor; }
  .tag.late { color: var(--late); border-color: var(--late); background: var(--late-soft); }
  .tag.late::before { border-radius: 1px; }

  /* Forms */
  .field { display: flex; flex-direction: column; gap: 4px; font-size: 14px; font-weight: 500; }
  input[type=text], input[type=email], input[type=date] {
    font: 15px/1.4 var(--font); color: var(--ink); background: var(--surface);
    border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 8px 10px;
  }
  input:focus { outline: 3px solid rgba(31, 61, 107, 0.25); border-color: var(--accent); }
  .btn {
    font: 500 14px/1 var(--font); padding: 10px 16px; border-radius: var(--radius); cursor: pointer;
    border: 1px solid var(--accent); background: var(--accent); color: #fff; text-decoration: none;
    display: inline-block;
  }
  .btn:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn.secondary { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
  .btn.secondary:hover { border-color: var(--ink); }

  /* Messages: a coloured rule plus words, so colour is never the only signal */
  .notice { border: 1px solid var(--line); border-left: 4px solid var(--late); background: var(--surface);
            border-radius: var(--radius); padding: 12px 16px; margin-bottom: 20px; }
  .notice strong { display: block; color: var(--late); }

  @media (max-width: 600px) { .brand span { display: none; } }

  {% block styles %}{% endblock %}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="/">FOI Request Tracker<span>Freedom of Information casework</span></a>
    <nav><a href="/docs">API docs</a></nav>
  </div>
</header>

<main class="wrap">
  {% block content %}{% endblock %}
</main>
</body>
</html>
